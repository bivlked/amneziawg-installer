name: Tests

on:
  push:
    branches: [main]
    paths: ['*.sh', 'scripts/**', 'tests/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['*.sh', 'scripts/**', 'tests/**', '.github/workflows/test.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # 🔴 Twenty, because ten had no headroom left and ran out. Measured on this
    # workflow: 7m41s before the module probe landed, 9m48s on its pull request
    # (green by twelve seconds), 10m18s on the push to main - which hits the cap
    # and is reported as `cancelled`, not as a failure, so it reads like somebody
    # pressed a button rather than like a run that never finished.
    # The suite genuinely takes that long now; this is a budget, not a symptom.
    # ⚠️ Not solved by `bats --jobs`: measured 21 sep 2026 on a three-core box,
    # a parallel run of this suite produced nine failures of which eight passed
    # when the same files were re-run serially, because some cases share state.
    # Parallelism here would trade a timeout for red runs on a green tree.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The SHA pin lockstep test compares each pin with the helper's
          # bytes at the tag the installer downloads from, so the tags and
          # their objects have to be here. On the branch and pull_request
          # events above the default checkout fetches neither (fetch-depth: 1,
          # fetch-tags: false), and the test then fails loudly rather than
          # degrade to a comparison that would mean nothing.
          fetch-depth: 0

      # qrencode: the vpn:// QR ceiling test runs the real binary with the
      # installer flags and fails in CI without it. jq: the --json tests skip
      # without it, so it is installed explicitly rather than assumed.
      - name: Install bats, qrencode and jq
        run: sudo apt-get update && sudo apt-get install -y bats qrencode jq

      - name: Run unit tests
        run: bats tests/*.bats
