name: ARM prebuilt kernel modules

on:
  workflow_dispatch:
    inputs:
      module_version:
        description: 'Upstream module tag/branch. Blank = use scripts/arm-module-version.txt pin, then default-branch HEAD.'
        required: false
        default: ''
  push:
    tags: ['v*']   # also rebuild on installer releases

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Ensure arm-packages release exists
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create arm-packages release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view arm-packages --repo "${{ github.repository }}" &>/dev/null; then
            gh release create arm-packages \
              --repo "${{ github.repository }}" \
              --title "ARM prebuilt kernel modules" \
              --notes "Precompiled amneziawg.ko packages for ARM targets. Updated automatically on each installer release. See README for supported kernels." \
              --prerelease
          fi

  build-arm-deb:
    name: Build ${{ matrix.id }}
    needs: prepare-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:

          # Raspberry Pi 4 / Pi 3 — arm64 (aarch64, Debian Bookworm)
          - id: rpi-bookworm-arm64
            platform: linux/arm64
            image: debian:bookworm
            extra_sources: rpi
            rpi_suite: bookworm
            headers_pkg: linux-headers-rpi-v8
            arch: arm64

          # Raspberry Pi 5 — arm64 (Cortex-A76, Debian Bookworm)
          - id: rpi5-bookworm-arm64
            platform: linux/arm64
            image: debian:bookworm
            extra_sources: rpi
            rpi_suite: bookworm
            headers_pkg: linux-headers-rpi-2712
            arch: arm64

          # Raspberry Pi 4 / Pi 3 — armhf (32-bit, Debian Bookworm)
          - id: rpi-bookworm-armhf
            platform: linux/arm/v7
            image: debian:bookworm
            extra_sources: rpi
            rpi_suite: bookworm
            headers_pkg: linux-headers-rpi-v7
            arch: armhf

          # Raspberry Pi OS on Debian Trixie (the default image since Oct 2026,
          # kernel 6.18+rpt): the same three boards. The trixie archive has no
          # armhf v7l headers, only v6 and v7.
          - id: rpi-trixie-arm64
            platform: linux/arm64
            image: debian:trixie
            extra_sources: rpi
            rpi_suite: trixie
            headers_pkg: linux-headers-rpi-v8
            arch: arm64

          - id: rpi5-trixie-arm64
            platform: linux/arm64
            image: debian:trixie
            extra_sources: rpi
            rpi_suite: trixie
            headers_pkg: linux-headers-rpi-2712
            arch: arm64

          - id: rpi-trixie-armhf
            platform: linux/arm/v7
            image: debian:trixie
            extra_sources: rpi
            rpi_suite: trixie
            headers_pkg: linux-headers-rpi-v7
            arch: armhf

          # Ubuntu 24.04 LTS — arm64 (Ampere A1, AWS Graviton, etc.)
          - id: ubuntu-2404-arm64
            platform: linux/arm64
            image: ubuntu:24.04
            extra_sources: ''
            headers_pkg: linux-headers-generic
            arch: arm64

          # Debian 12 Bookworm — arm64 (mainline kernel, VPS/cloud)
          - id: debian-bookworm-arm64
            platform: linux/arm64
            image: debian:bookworm
            extra_sources: ''
            headers_pkg: linux-headers-arm64
            arch: arm64

          # Debian 13 Trixie — arm64 (current stable, kernel 6.12 LTS)
          - id: debian-trixie-arm64
            platform: linux/arm64
            image: debian:trixie
            extra_sources: ''
            headers_pkg: linux-headers-arm64
            arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.platform }}

      - name: Prepare output dir
        run: mkdir -p ${{ github.workspace }}/output

      - name: Build .deb in target container
        env:
          KERNEL_ID: ${{ matrix.id }}
          EXTRA_SOURCES: ${{ matrix.extra_sources }}
          RPI_SUITE: ${{ matrix.rpi_suite }}
          HEADERS_PKG: ${{ matrix.headers_pkg }}
          MODULE_VERSION: ${{ inputs.module_version }}
          # On a tag push this records the installer release in the build manifest;
          # empty on workflow_dispatch.
          INSTALLER_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: ${{ matrix.image }}
          options: >-
            --platform ${{ matrix.platform }}
            -v ${{ github.workspace }}:/workspace
            -v ${{ github.workspace }}/output:/output
            -e KERNEL_ID
            -e EXTRA_SOURCES
            -e RPI_SUITE
            -e HEADERS_PKG
            -e OUTPUT_DIR=/output
            -e MODULE_VERSION
            -e INSTALLER_TAG
          run: |
            bash <<'CONTAINER_SCRIPT'
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive

            apt-get update -qq
            apt-get install -y --no-install-recommends \
              build-essential git curl gnupg ca-certificates \
              kmod dkms dpkg-dev xz-utils

            # Add Raspberry Pi Foundation apt repo if needed. The key comes
            # from the raspberrypi-archive-keyring package, pinned by sha256:
            # raspberrypi.gpg.key carries SHA1 self-signatures from 2012 and
            # apt 3.0 on trixie rejects it ("InRelease is not signed"); the
            # package holds the same key (CF8A1AF5...7FA3303E) re-signed in
            # 2025, which apt on bookworm accepts as well.
            if [[ "${EXTRA_SOURCES:-}" == "rpi" ]]; then
              : "${RPI_SUITE:?RPI_SUITE must be set for Raspberry Pi targets}"
              kr_deb=/tmp/raspberrypi-archive-keyring.deb
              curl -fsSL -o "$kr_deb" \
                "https://archive.raspberrypi.com/debian/pool/main/r/raspberrypi-archive-keyring/raspberrypi-archive-keyring_2025.1+rpt1_all.deb"
              echo "2e727149d7acb8cc7f604e66d0049161039c8aa1eaf1175e54f9e69d963d60e4  $kr_deb" \
                | sha256sum -c -
              mkdir -p /etc/apt/keyrings
              dpkg-deb --fsys-tarfile "$kr_deb" \
                | tar -xO ./usr/share/keyrings/raspberrypi-archive-keyring.pgp \
                > /etc/apt/keyrings/raspberrypi.pgp
              test -s /etc/apt/keyrings/raspberrypi.pgp
              echo "deb [signed-by=/etc/apt/keyrings/raspberrypi.pgp] \
                https://archive.raspberrypi.com/debian/ ${RPI_SUITE} main" \
                > /etc/apt/sources.list.d/raspberrypi.list
              apt-get update -qq
            fi

            apt-get install -y --no-install-recommends "${HEADERS_PKG}"
            mkdir -p /output
            bash /workspace/scripts/build-arm-deb.sh
            CONTAINER_SCRIPT

      - name: List output
        run: ls -lh ${{ github.workspace }}/output/

      - name: Upload to arm-packages release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          debs=( ${{ github.workspace }}/output/*.deb )
          if [[ ${#debs[@]} -eq 0 ]]; then
            echo "::error::No .deb artifacts found in output/"
            exit 1
          fi
          for deb in "${debs[@]}"; do
            gh release upload arm-packages "$deb" \
              --repo "${{ github.repository }}" \
              --clobber
            gh release upload arm-packages "${deb}.sha256" \
              --repo "${{ github.repository }}" \
              --clobber
            if [[ -f "${deb}.manifest.json" ]]; then
              gh release upload arm-packages "${deb}.manifest.json" \
                --repo "${{ github.repository }}" \
                --clobber
            fi
          done
