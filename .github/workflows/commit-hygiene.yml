name: Commit hygiene

# Runs on pull requests only. preflight-check.sh runs the same scan, but at TAG
# time inside release.yml, and by then a bad commit is long since merged:
# preflight diffs main..HEAD, so anything already in main is invisible to it.
# That gap let a commit mentioning a review bot reach main on 27 aug 2026
# through a "docs-only, surely fine" pull request where the author ran only the
# docs checker. This workflow closes it while the commit can still be amended.
#
# Both callers delegate to scripts/check-markers.sh so the list lives in one
# place. It used to be copied into both, with a comment asking readers to keep
# the copies in step; they drifted anyway, and the check that would have noticed
# was the one being copied.
#
# The scan covers commit messages AND the lines the branch adds. Messages alone
# were not enough: on 30 aug 2026 three lines naming internal documents reached
# the public tree through green pull requests, because nothing here read file
# content and preflight could no longer see them once merged.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need both sides of the comparison, and the commits in between.
          fetch-depth: 0

      - name: No forbidden markers or co-author trailers, in commits or content
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-markers.sh "$BASE" "$HEAD"

      - name: No newly added em/en-dash in the diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Python rather than grep -P on purpose: in a C locale grep matches the
          # class byte by byte and reports Cyrillic text and arrows as dashes.
          # A check that cries wolf is worse than no check, because people learn
          # to ignore it.
          # Three dots, not two: with two, anything main changed after this
          # branch left it looks like an addition made here, and a legacy dash
          # removed upstream fails a pull request that never touched it. There
          # are hundreds of legacy dashes in the docs, so this is not
          # hypothetical. preflight-check.sh already diffs three dots.
          #
          # The two commands are separate on purpose. With `|| true` on the
          # whole pipeline a failing git diff is indistinguishable from a clean
          # one: the redirect leaves an empty file and the check passes having
          # scanned nothing. Only grep is allowed to "fail", and only because
          # finding no added lines is a legitimate result.
          git diff "${BASE}...${HEAD}" --unified=0 -- . > /tmp/raw.txt
          grep '^+' /tmp/raw.txt | grep -v '^+++' > /tmp/added.txt || true
          python3 - <<'PY'
          import io, sys
          # The forbidden characters are built from code points on purpose. A
          # literal class here would put an em-dash into this very file, and the
          # first thing the check would find is itself. That is how a checker
          # ends up switched off instead of fixed.
          FORBIDDEN = (chr(0x2013), chr(0x2014))
          bad = []
          for line in io.open('/tmp/added.txt', encoding='utf-8', errors='replace'):
              if any(c in line for c in FORBIDDEN):
                  bad.append(line.rstrip('\n'))
          if bad:
              print('::error::added lines contain an em/en-dash (project uses hyphen-minus only):')
              for l in bad[:20]:
                  print(l[:200])
              sys.exit(1)
          print('No newly added em/en-dash.')
          PY
