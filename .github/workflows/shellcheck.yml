name: ShellCheck

on:
  push:
    branches: [main]
    paths: ['*.sh', 'scripts/**', 'tests/**']
  pull_request:
    branches: [main]
    paths: ['*.sh', 'scripts/**', 'tests/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Lint and syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Show ShellCheck version
        run: shellcheck --version

      - name: Run ShellCheck and syntax check
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' 'scripts/*.sh')
          mapfile -t tests < <(git ls-files 'tests/*.bash' 'tests/*.bats')
          all=("${scripts[@]}" "${tests[@]}")
          for f in "${all[@]}"; do
            echo "--- Checking $f ---"
            bash -n "$f"
            shellcheck -x -s bash -S warning "$f"
          done
