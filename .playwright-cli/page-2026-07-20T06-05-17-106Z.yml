                  - list [ref=e786]:
                    - listitem [ref=e787]:
                      - strong [ref=e788]: PPA 404 on Ubuntu 25.10 or 26.04.
                      - text: Automatic fallback to noble since v5.13.0. If you are still on v5.12.x, upgrade the installer.
                    - listitem [ref=e789]:
                      - strong [ref=e790]: DKMS build fails on stale kernel headers
                      - text: (typical after
                      - code [ref=e791]: do-release-upgrade
                      - text: 24.04 to 25.10). v5.13.0 detects stale headers (kernel version differs from the running kernel) and installs gcc-13 as a fallback compiler so DKMS autoinstall succeeds across the version mismatch. If DKMS still fails,
                      - code [ref=e792]: sudo bash /root/awg/manage_amneziawg.sh repair-module
                      - text: forces a rebuild.
                    - listitem [ref=e793]:
                      - strong [ref=e794]: Mobile carrier unstable or only connects on the third attempt.
                      - text: Reinstall with
                      - code [ref=e795]: "--mobile"
                      - text: "- it enables the mobile obfuscation preset and moves the port to 443/udp in one flag (carriers often drop unfamiliar UDP ports; an explicit"
                      - code [ref=e796]: "--port"
                      - text: "wins if you pass both). Tested carriers (Russia): Yota (Moscow), Tele2 (Moscow), Tattelecom / Letai (Tatarstan), Beeline (default preset). Tele2 (Krasnoyarsk) and Megafon (regional networks) additionally need the I1 parameter removed. Full per-carrier table and the underlying Jc / Jmin / Jmax mechanics are in"
                      - link "ADVANCED.en.md FAQ" [ref=e797] [cursor=pointer]:
                        - /url: /bivlked/amneziawg-installer/blob/release/v5.21.0/ADVANCED.en.md#faq-advanced-adv
                      - text: .
                    - listitem [ref=e798]:
                      - strong [ref=e799]: Handshake completes but no packets flow.
                      - text: Almost always the AllowedIPs gotcha on a custom split-tunnel config. Cover the server subnet too, not just the destinations you want. See
                      - link "ADVANCED.en.md AllowedIPs" [ref=e800] [cursor=pointer]:
                        - /url: /bivlked/amneziawg-installer/blob/release/v5.21.0/ADVANCED.en.md#allowedips-adv
                      - text: .
                    - listitem [ref=e801]:
                      - strong [ref=e802]: iPhone does not connect over cellular.
                      - text: MTU issue. The installer sets
                      - code [ref=e803]: MTU = 1280
                      - text: by default since v5.7.4; older configs need the line added manually. See
                      - link "MTU and Mobile Clients" [ref=e804] [cursor=pointer]:
                        - /url: /bivlked/amneziawg-installer/blob/release/v5.21.0/ADVANCED.en.md#mtu-mobile-adv
                      - text: .
                    - listitem [ref=e805]:
                      - strong [ref=e806]: ARM prebuilt unavailable for your kernel.
                      - text: The installer falls back to DKMS automatically since v5.12.1. If both fail, file an issue with
                      - code [ref=e807]: sudo bash ./install_amneziawg_en.sh --diagnostic
                      - text: output.
