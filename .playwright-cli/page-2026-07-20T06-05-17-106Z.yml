                    - 'link "Permalink: Update flow" [ref=e746] [cursor=pointer]':
                      - /url: "#update-flow"
                  - paragraph [ref=e749]: "Updating to a newer installer release on a server that already has a supported version running:"
                  - generic [ref=e750]:
                    - generic [ref=e751]: wget -O install_amneziawg_en.sh https://raw.githubusercontent.com/bivlked/amneziawg-installer/vX.Y.Z/install_amneziawg_en.sh sudo bash ./install_amneziawg_en.sh --force
                    - button "Copy code to clipboard" [ref=e753] [cursor=pointer]
                  - paragraph [ref=e757]:
                    - text: The
                    - code [ref=e758]: "--force"
                    - text: flag (or
                    - code [ref=e759]: AWG_FORCE_REINSTALL=1
                    - text: ") is required when reinstalling over an already-running AmneziaWG service, so an accidental re-run on a healthy box does not destroy state. First-time installs do not need it. Server keys, peer list, and obfuscation parameters survive a reinstall. Since v5.20.1 the management script verifies that the shared library version is compatible with its own: an incompatible pair (say, only one half updated to a new minor release) stops with a clear message and ready-to-paste commands for updating both, instead of failing in cryptic ways."
                  - paragraph [ref=e760]:
                    - text: A normal
                    - code [ref=e761]: apt-get upgrade
                    - text: will pull a new kernel from time to time. For DKMS-based installs (typical for amd64 and most ARM64 deployments without a prebuilt for the new kernel),
                    - code [ref=e762]: amneziawg-ensure-module
                    - text: rebuilds the module transparently at the next boot. Check its log with
                    - code [ref=e763]: journalctl -u amneziawg-ensure-module.service -b
                    - text: or read the rolling apt-hook log at
                    - code [ref=e764]: /var/log/amneziawg-ensure-module.log
                    - text: ". Manual recovery if all three safety nets miss:"
                    - code [ref=e765]: sudo bash /root/awg/manage_amneziawg.sh repair-module
                    - text: reinstalls headers, rebuilds DKMS, and restarts the service. ARM users running an ARM prebuilt should rerun the installer after a kernel upgrade so it picks a fresh prebuilt or falls back to DKMS.
                  - generic [ref=e766]:
