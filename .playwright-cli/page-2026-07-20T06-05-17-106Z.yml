              - region "INSTALL_VPS.md" [ref=e572]:
                - article [ref=e574]:
                  - generic [ref=e575]:
                    - heading "Install AmneziaWG VPN server on Ubuntu / Debian VPS" [level=1] [ref=e576]
                    - 'link "Permalink: Install AmneziaWG VPN server on Ubuntu / Debian VPS" [ref=e577] [cursor=pointer]':
                      - /url: "#install-amneziawg-vpn-server-on-ubuntu--debian-vps"
                  - paragraph [ref=e580]: A step-by-step guide for deploying an AmneziaWG 2.0 VPN server on a clean Ubuntu or Debian VPS over SSH. Single bash command, no Docker, no web panel. Aimed at headless setups where you want a working DPI-resistant VPN with the lowest possible footprint on a cheap VPS.
                  - blockquote [ref=e581]:
                    - paragraph [ref=e582]:
                      - text: The official
                      - link "Amnezia VPN" [ref=e583] [cursor=pointer]:
                        - /url: https://amnezia.org/
                      - text: "app deploys the server side for you in Docker. This guide takes a different route on purpose: AmneziaWG as a kernel module, no Docker overhead, and the whole server tuned and hardened for a single-purpose VPN. See"
                      - link "how it differs" [ref=e584] [cursor=pointer]:
                        - /url: https://bivlked.github.io/amneziawg-installer/compare/
                      - text: .
                  - generic [ref=e585]:
                    - heading "TL;DR" [level=2] [ref=e586]
                    - 'link "Permalink: TL;DR" [ref=e587] [cursor=pointer]':
                      - /url: "#tldr"
                  - list [ref=e590]:
                    - listitem [ref=e591]: One command, MIT-licensed, fully self-hosted, no third-party dependencies at runtime.
                    - listitem [ref=e592]: Works on Ubuntu 24.04 LTS, Ubuntu 25.10/26.04, Debian 12 (bookworm), Debian 13 (trixie).
                    - listitem [ref=e593]: "Built for cheap VPS budgets: $3 to $5 a month, 1 vCPU, 512 MB RAM minimum (1 GB recommended), 2 GB disk minimum (3+ GB recommended)."
                    - listitem [ref=e594]: Both x86_64 (amd64) and ARM64 (aarch64), with prebuilt kernel modules covering Raspberry Pi 4/5, Ubuntu 24.04/25.10 ARM64, and Debian 12/13 ARM64 (Hetzner CAX, Oracle Ampere A1, AWS Graviton all run on these stock kernels). Ubuntu 26.04 ARM64 builds the module from source via DKMS.
                    - listitem [ref=e595]: DPI bypass for Russia (ТСПУ), Iran, China, school and corporate firewalls.
                    - listitem [ref=e596]: Survives kernel upgrades automatically via DKMS auto-repair (since v5.12.0).
                    - listitem [ref=e597]: Ubuntu 25.10 and 26.04 PPA fallback to noble is automatic since v5.13.0.
                  - generic [ref=e598]:
                    - heading "Choosing a VPS" [level=2] [ref=e599]
                    - 'link "Permalink: Choosing a VPS" [ref=e600] [cursor=pointer]':
                      - /url: "#choosing-a-vps"
                  - paragraph [ref=e603]: "A VPN server is mostly idle CPU and steady network. Three picks I keep coming back to:"
                  - list [ref=e604]:
                    - listitem [ref=e605]:
                      - strong [ref=e606]: Hetzner CAX11 / CAX21
                      - text: "(ARM Ampere, EU). About €4 / month for 2 vCPU and 4 GB RAM. Wide bandwidth, EU jurisdiction, prebuilt ARM kernel module is published for this exact platform. The catch: Hetzner subnets are widely blacklisted by Russian carriers (TSPU, Rostelecom, MTS), so do not use Hetzner if you are routing Russian mobile traffic into the tunnel. Pick a non-Russia-blacklisted host for that case."
                    - listitem [ref=e607]:
                      - strong [ref=e608]: Oracle Cloud Always Free (ARM Ampere A1)
                      - text: . 4 vCPU and 24 GB RAM in the free tier, no expiry, multiple regions. Reliable but capacity-limited (Oracle releases A1 quotas in waves).
                    - listitem [ref=e609]:
                      - strong [ref=e610]: Generic budget VPS
                      - text: (Vultr, RackNerd, your local provider). Pick anything with 1 GB RAM, root SSH access, and not on a known-bad subnet for your audience. ARM is fine where prebuilts apply, otherwise amd64 with DKMS-built kernel module works the same way.
                  - paragraph [ref=e611]: Country matters mostly for latency and jurisdiction. ARM versus amd64 has no real performance difference for a personal-scale VPN.
                  - generic [ref=e612]:
                    - heading "OS choice" [level=2] [ref=e613]
                    - 'link "Permalink: OS choice" [ref=e614] [cursor=pointer]':
                      - /url: "#os-choice"
                  - list [ref=e617]:
                    - listitem [ref=e618]:
                      - strong [ref=e619]: Ubuntu 24.04 LTS
                      - text: is the best-tested platform. Default pick if you have no other preference.
                    - listitem [ref=e620]:
                      - strong [ref=e621]: Ubuntu 25.10
                      - text: (questing) and
                      - strong [ref=e622]: Ubuntu 26.04
                      - text: work since v5.13.0. The PPA codename remaps to
                      - code [ref=e623]: noble
                      - text: automatically when the running codename PPA is unreachable (404 or network failure). Resilient against do-release-upgrade from 24.04.
                    - listitem [ref=e624]:
                      - strong [ref=e625]: Debian 12
                      - text: (bookworm) and
                      - strong [ref=e626]: Debian 13
                      - text: (trixie) are fully supported with codename mapping (focal and noble respectively).
                    - listitem [ref=e627]: Use a minimal install. The script assumes the box is single-purpose and will strip modemmanager, snapd, cloud-init leftovers and similar to free resources.
                    - listitem [ref=e628]: Avoid custom kernels (XanMod, Liquorix, Zen) on first install. DKMS compiles against the running kernel headers, but custom kernels can shift internal structs and trip a runtime panic. If you must, file a repro upstream rather than guessing.
                  - generic [ref=e629]:
                    - heading "One-command install" [level=2] [ref=e630]
                    - 'link "Permalink: One-command install" [ref=e631] [cursor=pointer]':
                      - /url: "#one-command-install"
                  - paragraph [ref=e634]:
                    - text: Connect as root (or as a sudo-capable user and prepend
                    - code [ref=e635]: sudo
                    - text: ). The installer usually detects the SSH port automatically and allows it in UFW. If SSH runs on a non-standard port or autodetection is unavailable, pass
                    - code [ref=e636]: "--ssh-port=YOUR_PORT"
                    - text: to the installer (comma-separated for several ports). As an extra conservative safeguard you can allow the port in UFW
                    - strong [ref=e637]: before
                    - text: "running the installer:"
                  - generic [ref=e638]:
                    - generic [ref=e639]: sudo ufw allow <your-ssh-port>/tcp
                    - button "Copy code to clipboard" [ref=e641] [cursor=pointer]
                  - paragraph [ref=e645]: "Then:"
                  - generic [ref=e646]:
                    - generic [ref=e647]: wget -O install_amneziawg_en.sh https://raw.githubusercontent.com/bivlked/amneziawg-installer/v5.20.1/install_amneziawg_en.sh chmod +x install_amneziawg_en.sh sudo bash ./install_amneziawg_en.sh
                    - button "Copy code to clipboard" [ref=e649] [cursor=pointer]
                  - paragraph [ref=e653]:
                    - text: The script walks through OS detection, base packages, PPA setup, kernel module install (DKMS or ARM prebuilt), UFW firewall, sysctl hardening, Fail2Ban, AmneziaWG service start, and default client config generation. Expect two reboots and 15 to 25 minutes of wall-clock time, mostly bound by
                    - code [ref=e654]: apt
                    - text: and the kernel module build.
                  - paragraph [ref=e655]:
                    - text: The script is
                    - strong [ref=e656]: idempotent and resume-safe
                    - text: ": after each reboot, run the same command again and it picks up from where it left off. State lives in"
                    - code [ref=e657]: /root/awg/setup_state
                    - text: ". Two reboots are part of the normal flow:"
