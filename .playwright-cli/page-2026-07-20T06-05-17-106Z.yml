                    - text: "The uninstall path is symmetric: it removes the AmneziaWG service, the kernel module via DKMS, the PPA, the AmneziaWG-specific UFW rules (reverting to the pre-install UFW state via a marker file), Fail2Ban jails, and"
                    - code [ref=e779]: /root/awg/
                    - text: ","
                    - code [ref=e780]: /etc/amnezia/
                    - text: . Manage script and shared library go too. Re-installing later starts from a clean slate.
