                    - text: and the routing flag of your choice, e.g.
                    - code [ref=e678]: sudo bash ./install_amneziawg_en.sh --yes --route-amnezia
                    - text: ". Common flags:"
                    - code [ref=e679]: "--port=39743"
                    - text: (any port 1-65535),
                    - code [ref=e680]: "--subnet=10.9.9.1/24"
